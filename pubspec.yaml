name: ch_atta_traders_billing_application
description: "An application that uses a Bluetooth printer to generate printouts for Atta Traders, a Pepsi distribution business."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.3.3
  go_router: ^17.0.0
  flutter_svg: ^2.2.3
  animated_text_kit: ^4.3.0
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  uuid: ^4.5.2
  local_auth: ^3.0.0
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  print_bluetooth_thermal: ^1.1.9
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  animations: ^2.1.1
  device_info_plus: ^12.3.0
  sqflite: ^2.4.2
  path: ^1.9.1
  font_awesome_flutter: ^10.12.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13


flutter:

  uses-material-design: true

  
  assets:
    - assets/images/
    - assets/files/CHAUDHARY_ATTA_TRADERS_Shops.csv

