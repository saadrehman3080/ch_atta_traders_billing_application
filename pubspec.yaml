name: ch_atta_traders_billing_application
description: "An application that uses a Bluetooth printer to generate printouts for Atta Traders, a Pepsi distribution business."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.3.3
  go_router: ^17.0.0
  flutter_svg: ^2.2.3
  animated_text_kit: ^4.3.0
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  
  assets:
    - assets/images/

